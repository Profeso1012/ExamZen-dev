<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamZen - Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles1.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Outfit', sans-serif;
            background-color: #fff;
        }
    </style>
</head>

<body>
    <!-- Flash Messages (Optional, can be styled minimally) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div style="position: fixed; top: 20px; right: 20px; z-index: 9999;">
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} animate__animated animate__fadeInRight shadow-sm"
            style="background: white; padding: 15px 20px; border-radius: 8px; border-left: 4px solid var(--primary-color); margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-info-circle" style="color: var(--primary-color);"></i>
            <div>{{ message }}</div>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
