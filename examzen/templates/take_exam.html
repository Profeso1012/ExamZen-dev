{% extends "layout.html" %}
{% block content %}
<!-- JSON Data Injection -->
<script>
    window.examData = {
        examId: {{ exam.id }},
    duration: { { exam.duration } },
    startTime: "{{ exam.start_time.isoformat() if exam.start_time else '' }}",
        questions: { { questions_json | safe } }
    };
</script>

<!-- Sub-header for Exam Status -->
<div class="exam-header animate__animated animate__fadeInDown">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h5 class="mb-0">{{ exam.name }}</h5>
            <small class="text-muted"><span id="q-number">Question 1</span></small>
        </div>
        <div class="d-flex align-items-center gap-3">
            <div class="timer-box" id="timer-display">
                --:--
            </div>
            <button class="btn btn-warning btn-sm" onclick="alert('Flagged for Review')"><i
                    class="fas fa-flag"></i></button>
        </div>
    </div>
    <!-- Progress Bar -->
    <div class="progress mt-2" style="height: 4px; border-radius: 0;">
        <div class="progress-bar bg-accent" id="timer-bar" role="progressbar" style="width: 100%;"></div>
    </div>
</div>

<div class="container question-area">
    <div class="row">
        <!-- Main Question Column -->
        <div class="col-md-9">
            <div id="question-container" class="card shadow-sm animate__animated animate__fadeInRight">
                <div class="card-body p-5">
                    <h4 class="mb-4" id="q-text">Loading question...</h4>

                    <div id="options-container">
                        <!-- Options generated by JS -->
                    </div>
                </div>
                <div class="card-footer bg-white d-flex justify-content-between">
                    <button class="btn btn-outline-secondary" id="btn-prev" disabled>Previous</button>
                    <button class="btn btn-primary" id="btn-next">Next</button>
                </div>
            </div>

            <!-- Hidden Form for Submission -->
            <form id="exam-form" method="POST" action="{{ url_for('submit_exam', exam_id=exam.id) }}"
                style="display:none;">
                {% for q in questions_json %}
                <input type="hidden" name="q_{{ q.id }}" id="input_q_{{ q.id }}" value="">
                {% endfor %}
            </form>
        </div>

        <!-- Sidebar Palette -->
        <div class="col-md-3 d-none d-md-block">
            <div class="card shadow-sm animate__animated animate__fadeInLeft">
                <div class="card-body">
                    <h6 class="text-uppercase text-muted mb-3">Question Palette</h6>
                    <div class="palette-grid">
                        {% for q in questions_json %}
                        <div class="palette-item" id="palette-{{ loop.index0 }}"
                            onclick="renderQuestion({{ loop.index0 }})">
                            {{ loop.index }}
                        </div>
                        {% endfor %}
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between text-muted small">
                        <span>
                            <div class="palette-item d-inline-block" style="width:10px;height:10px;"></div> Unanswered
                        </span>
                        <span>
                            <div class="palette-item answered d-inline-block" style="width:10px;height:10px;"></div>
                            Answered
                        </span>
                    </div>
                </div>
            </div>

            <!-- Proctor placeholder -->
            <div class="card mt-3 shadow-sm border-warning">
                <div class="card-body text-center">
                    <i class="fas fa-video text-warning mb-2"></i>
                    <p class="small text-muted mb-0">Proctoring Active</p>
                    <small>Do not switch tabs.</small>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/exam_engine.js') }}"></script>
{% endblock %}
