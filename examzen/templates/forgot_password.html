{% extends "auth_layout.html" %}
{% block content %}
<div class="auth-container">
    <!-- Left Side form -->
    <div class="auth-left animate__animated animate__fadeInLeft">
        <div class="auth-header">
            <h1 class="auth-title">Forgot Password?</h1>
            <p class="auth-subtitle">Enter your email to receive reset instructions.</p>
        </div>

        <form method="POST" action="" class="auth-form">
            <div class="form-group mb-4">
                <label class="form-label text-muted small text-uppercase font-weight-bold" for="email">Email</label>
                <input class="form-control" id="email" name="email" placeholder="name@example.com" required type="email"
                    value="">
            </div>

            <div class="form-group">
                <input class="btn btn-auth-primary btn-block" id="submit" name="submit" type="submit"
                    value="Reset Password">
            </div>

            <div class="text-center mt-3">
                <small class="text-muted">
                    Remember your password? <a href="{{ url_for('login') }}" class="font-weight-bold text-primary">Log
                        In</a>
                </small>
            </div>
        </form>
    </div>

    <!-- Right Side Visual -->
    <div class="auth-right animate__animated animate__fadeInRight">
        <img src="{{ url_for('static', filename='images/auth_illustration.png') }}" class="auth-right-bg"
            alt="Abstract Background">
        <div class="auth-right-content">
            <h2 class="mb-3">Secure Account Recovery</h2>
            <p class="lead" style="font-size: 1.1rem; opacity: 0.9;">
                We'll help you get back on track securely and quickly.
            </p>
        </div>
    </div>
</div>
{% endblock %}
